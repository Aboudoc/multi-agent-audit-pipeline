name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Compile all modules
        run: python -m py_compile run.py pipeline/*.py
      - name: Dry run (no API key needed)
        run: python run.py examples/ --dry-run
